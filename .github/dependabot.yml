version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: daily
    time: '22:00'
    timezone: Etc/UTC
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
  allow:
  - dependency-type: all
  versioning-strategy: auto
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - automated
  commit-message:
    prefix: build(deps)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '22:00'
    timezone: Etc/UTC
  groups:
    github-actions:
      patterns:
      - '*'
  labels:
  - github-actions
  - automated
  commit-message:
    prefix: ci(deps)
